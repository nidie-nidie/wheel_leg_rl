        - paragraph [ref=e3384]:
          - code [ref=e3385]: JM
          - text: 、
          - code [ref=e3386]: KN
          - text: 是两端铰接的实体连杆；
          - code [ref=e3387]: LM
          - text: 、
          - code [ref=e3388]: PN
          - text: 是各自复合刚体内两个固定点之间的距离。第一次的两个半径恰好都约为 115 mm，只说明 J–M–L 是等腰三角形，并不表示 J、L、M 共线，也不能删掉任意一条距离约束。
        - generic [ref=e3389]: 两种装配支路：每次圆交通常都有两个候选点。离线零位中第一次使用 σ=+1、第二次使用 σ=−1 才对应 XML 当前装配；实时计算更稳妥的方式是选择“与上一周期交点最近”的候选点，避免跳到机构另一侧。
        - generic [ref=e3390]:
          - text: 不要把后续定位向量当成圆半径：ℓ
          - subscript [ref=e3391]: MK
          - text: =0.176308 m 是 v⃗
          - subscript [ref=e3392]: MK
          - superscript [ref=e3393]: ref
          - text: 的长度，求得 M 后才用于定位 K；ℓ
          - subscript [ref=e3394]: PW
          - text: =0.258000 m 是 v⃗
          - subscript [ref=e3395]: PW
          - superscript [ref=e3396]: ref
          - text: 的长度，求得 N 后才用于定位 W。它们不参与各自前一步的圆交半径约束。
        - heading "4.3 从电机反馈到轮轴坐标：把两次闭链完全展开" [level=3] [ref=e3397]
        - paragraph [ref=e3398]: 下面的流程只描述正运动学。所谓“闭链 1”是前支路 J→M 与后侧刚体固定点距 L→M 必须在同一个 M 会合；“闭链 2”是连杆 K→N 与输出刚体固定点距 P→N 必须在同一个 N 会合。圆只是这两个固定距离约束的坐标表达。
        - img "从 XML 固定几何和实时时关节角开始，经 J L 两圆求 M、由刚体求 K、K P 两圆求 N、由输出刚体求 W，最终得到 L0 phi0 theta 的详细闭链流程图" [ref=e3400]:
          - generic [ref=e3407]:
            - generic [ref=e3408]: A 数据来源与坐标对齐
            - generic [ref=e3409]: B 闭链 1：J–M–L 会合于 M
            - generic [ref=e3410]: C 刚体 jMK：由 M、L 的朝向定位 K
            - generic [ref=e3411]: D 闭链 2：K–N–P 会合于 N
            - generic [ref=e3412]: E 输出刚体与虚拟腿坐标
          - generic [ref=e3418]:
            - generic [ref=e3419]: 开始：执行一次腿部正运动学
            - generic [ref=e3422]:
              - generic [ref=e3424]: 固定输入：XML / CAD 刚体几何
              - generic [ref=e3425]: 参考向量 v⃗IJ、v⃗IL、v⃗IP；标量杆长 ℓJM、ℓLM、ℓKN、ℓPN
              - generic [ref=e3426]: 体固连参考向量 v⃗ML、v⃗MK、v⃗PN、v⃗PW；运行期间不改变
            - generic [ref=e3427]:
              - generic [ref=e3429]: 实时输入：编码器位置或 MuJoCo qpos
              - generic [ref=e3430]: 先统一极性、前后顺序和零偏：qmodel = SΠ·pmotor + b
              - generic [ref=e3431]: 得到模型主动角 qf（前支路）、qr（后支路），单位 rad
            - generic [ref=e3432]:
              - generic [ref=e3434]: 先把三个主动端点放进以 I 为原点的 (s,z) 腿平面
              - generic [ref=e3435]: r⃗J=R(qf)v⃗IJ r⃗L=R(qr)v⃗IL r⃗P=R(qr)v⃗IP
              - generic [ref=e3436]: 带箭头的是二维位置向量：r⃗J=(sJ,zJ)、r⃗L=(sL,zL)、r⃗P=(sP,zP)
            - generic [ref=e3437]:
              - generic [ref=e3439]: 第一次闭链：未知点 M 必须同时满足两条固定距离
              - generic [ref=e3440]: 圆心 J、半径 ℓJM ∩ 圆心 L、半径 ℓLM → 候选 M₊、M₋
              - generic [ref=e3441]: 物理含义：前支路杆 JM 与后侧刚体内点距 LM 必须在同一个铰点 M 会合
              - generic [ref=e3442]: 先算 ρM=‖r⃗L−r⃗J‖ 并检查三角不等式；通过后才计算 e⃗M、aM、hM
            - generic [ref=e3443]:
              - generic [ref=e3445]: ρM>ε
              - generic [ref=e3446]: abs(ℓJM−ℓLM)<ρM
              - generic [ref=e3447]: ρM<ℓJM+ℓLM？
            - generic [ref=e3448]: 是：存在两个候选 M
            - generic [ref=e3449]: 否
            - generic [ref=e3450]:
              - generic [ref=e3452]: 终止本周期：闭链 1 无安全实解
              - generic [ref=e3453]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=e3454]:
              - generic [ref=e3456]: 选择与 XML 装配/上一周期连续的 σM，输出 M 的实际坐标
              - generic [ref=e3457]: e⃗M=(r⃗L−r⃗J)/ρM；r⃗M=r⃗J+aM e⃗M+σM hM e⃗M⊥
            - generic [ref=e3458]:
              - generic [ref=e3460]: 刚体 jMK：M、L 两点确定当前朝向，再定位同一刚体上的 K
              - generic [ref=e3461]: α=angle(r⃗L−r⃗M)−angle(v⃗ML)
              - generic [ref=e3462]: r⃗K=r⃗M+R(α)v⃗MK；点 K 的当前坐标不是直接从静态 XML 抄出
            - generic [ref=e3463]:
              - generic [ref=e3465]: 第二次闭链：未知点 N 必须同时满足两条固定距离
              - generic [ref=e3466]: 圆心 K、半径 ℓKN ∩ 圆心 P、半径 ℓPN → 候选 N₊、N₋
              - generic [ref=e3467]: 物理含义：连杆 KN 与输出刚体内点距 PN 必须在同一个铰点 N 会合
              - generic [ref=e3468]: 先算 ρN=‖r⃗P−r⃗K‖ 并检查三角不等式；通过后才计算 e⃗N、aN、hN
            - generic [ref=e3469]:
              - generic [ref=e3471]: ρN>ε
              - generic [ref=e3472]: abs(ℓKN−ℓPN)<ρN
              - generic [ref=e3473]: ρN<ℓKN+ℓPN？
            - generic [ref=e3474]: 是：存在两个候选 N
            - generic [ref=e3475]: 否
            - generic [ref=e3476]:
              - generic [ref=e3478]: 终止本周期：闭链 2 无安全实解
              - generic [ref=e3479]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=e3480]:
              - generic [ref=e3482]: 选择与 XML 装配/上一周期连续的 σN，输出 N 的实际坐标
              - generic [ref=e3483]: e⃗N=(r⃗P−r⃗K)/ρN；r⃗N=r⃗K+aN e⃗N+σN hN e⃗N⊥
            - generic [ref=e3484]:
              - generic [ref=e3486]: 输出刚体 jOP：P、N 两点确定朝向 β，再直接定位轮轴 W
              - generic [ref=e3487]: β=angle(r⃗N−r⃗P)−angle(v⃗PN)
              - generic [ref=e3488]: r⃗W=r⃗P+R(β)v⃗PW → r⃗W=(sW,zW)
              - generic [ref=e3489]: 这里没有第三次圆交：P 给位置，P→N 给朝向，固定 P→W 给轮轴在刚体内的位置
            - generic [ref=e3490]:
              - generic [ref=e3492]: 把轮轴坐标变成控制器使用的虚拟腿状态
              - generic [ref=e3493]: dW=−zW；L0=√(sW²+dW²)；φ0=atan2(dW,sW)
              - generic [ref=e3494]: θleg=π/2−φ0；控制状态 θ=π/2−Pitch−φ0
            - generic [ref=e3495]:
              - generic [ref=e3497]: 正运动学 H(q) 完成
              - generic [ref=e3498]: 输出 W、L0、φ0、θ，供 Observe/LQR 与下一节 JH 使用
