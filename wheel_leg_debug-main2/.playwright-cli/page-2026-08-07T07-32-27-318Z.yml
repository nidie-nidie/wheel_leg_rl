          - listitem [ref=e7041]: 实车模型角标定：确认每台电机的 S、Π，并用至少一个可重复参考姿态求 b；再用另外 3～5 个姿态验证同一个 b 能否复现轮轴位置。MuJoCo 通过不能替代这一步。
