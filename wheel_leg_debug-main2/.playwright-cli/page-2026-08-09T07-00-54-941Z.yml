            - generic [ref=e3710]: 开始：执行一次腿部正运动学
            - generic [ref=e3713]:
              - generic [ref=e3715]: 固定输入：XML / CAD 刚体几何
              - generic [ref=e3716]: 参考向量 vIJ、vIL、vIP；标量杆长 ℓJM、ℓLM、ℓKN、ℓPN
              - generic [ref=e3717]: 体固连参考向量 vML、vMK、vPN、vPW；运行期间不改变
            - generic [ref=e3718]:
              - generic [ref=e3720]: 实时输入：编码器位置或 MuJoCo qpos
              - generic [ref=e3721]: 先统一极性、前后顺序和零偏：qmodel = SΠ·pmotor + b
              - generic [ref=e3722]: 得到模型主动角 qf（前支路）、qr（后支路），单位 rad
            - generic [ref=e3723]:
              - generic [ref=e3725]: 由两个主动角定位三个已知点 J、L、P
              - generic [ref=e3726]: rJ=R(qf)vIJ rL=R(qr)vIL rP=R(qr)vIP
              - generic [ref=e3727]: J 由 qf 定位；L、P 在同一后侧主动刚体上，都由同一个 qr 定位——只有两个主动自由度
            - generic [ref=e3728]:
              - generic [ref=e3730]: 第一次闭链：未知点 M 必须同时满足两条固定距离
              - generic [ref=e3731]: 圆心 J、半径 ℓJM ∩ 圆心 L、半径 ℓLM → 候选 M₊、M₋
              - generic [ref=e3732]: 物理含义：前支路杆 JM 与后侧刚体内点距 LM 必须在同一个铰点 M 会合
              - generic [ref=e3733]: 先算 ρM=‖rL−rJ‖ 并检查三角不等式；通过后才计算单位向量 eM、aM、hM
            - generic [ref=e3734]:
              - generic [ref=e3736]: ρM>ε
              - generic [ref=e3737]: abs(ℓJM−ℓLM)<ρM
              - generic [ref=e3738]: ρM<ℓJM+ℓLM？
            - generic [ref=e3739]: 是：存在两个候选 M
            - generic [ref=e3740]: 否
            - generic [ref=e3741]:
              - generic [ref=e3743]: 终止本周期：闭链 1 无安全实解
              - generic [ref=e3744]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=e3745]:
              - generic [ref=e3747]: 选择物理装配支路 M；q=0 时 σM=+1
              - generic [ref=e3748]: 运行时比较 M± 与上一周期 M；σ 只表示 ±eM⊥，不固定表示全局上/下
            - generic [ref=e3749]:
              - generic [ref=e3751]: 刚体 jMK：M、L 两点确定当前朝向，再定位同一刚体上的 K
              - generic [ref=e3752]: α=angle(rL−rM)−angle(vML)
              - generic [ref=e3753]: rK=rM+R(α)vMK；点 K 的当前坐标不是直接从静态 XML 抄出
            - generic [ref=e3754]:
              - generic [ref=e3756]: 第二次闭链：未知点 N 必须同时满足两条固定距离
              - generic [ref=e3757]: 圆心 K、半径 ℓKN ∩ 圆心 P、半径 ℓPN → 候选 N₊、N₋
              - generic [ref=e3758]: 物理含义：连杆 KN 与输出刚体内点距 PN 必须在同一个铰点 N 会合
              - generic [ref=e3759]: 先算 ρN=‖rP−rK‖ 并检查三角不等式；通过后才计算单位向量 eN、aN、hN
            - generic [ref=e3760]:
              - generic [ref=e3762]: ρN>ε
              - generic [ref=e3763]: abs(ℓKN−ℓPN)<ρN
              - generic [ref=e3764]: ρN<ℓKN+ℓPN？
            - generic [ref=e3765]: 是：存在两个候选 N
            - generic [ref=e3766]: 否
            - generic [ref=e3767]:
              - generic [ref=e3769]: 终止本周期：闭链 2 无安全实解
              - generic [ref=e3770]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=e3771]:
              - generic [ref=e3773]: 选择物理装配支路 N；q=0 时 σN=−1
              - generic [ref=e3774]: 运行时比较 N± 与上一周期 N；第二次 +eN⊥ 指向右下，所以实际上方 N 使用 −1
            - generic [ref=e3775]:
