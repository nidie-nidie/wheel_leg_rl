            - text: 点坐标复验：随机给 10～20 组 qf、qr；解析正解输出 J、L、P、M、K、N、W；MuJoCo 写入同一组主动/被动 qpos 后调用
            - code [ref=e7398]: mj_forward
            - text: ，逐点比较。先验证 W 之前的每个中间点，才能定位是哪一处闭链出错。
          - listitem [ref=e7399]:
            - text: 雅可比有限差分复验：分别只扰动 qf 和 qr，比较
            - code [ref=e7400]: H(q+δq)−H(q)
            - text: 与
            - code [ref=e7401]: JH(q)δq
            - text: ；再把 δq 减半，误差应约缩小到四分之一。
          - listitem [ref=e7402]:
            - text: 虚功/功率复验：随机给很小 δq 与虚拟力 [F0,Tφ]，检查
            - code [ref=e7403]: τᵀδq
            - text: 和
            - code [ref=e7404]: F0δL0+Tφδφ0
            - text: ；这一步专门检出转置、φ0/θ 负号、前后列交换问题。
          - listitem [ref=e7405]: MuJoCo 控制 A/B：在同一个模型、初始姿态、限幅和控制周期下，只切换“旧理想 H/J”与“精确 H/J”；先做零力矩、低增益静态腿长，再做小幅正弦腿长，最后才接完整 LQR。
          - listitem [ref=e7406]: 实车模型角标定：确认每台电机的 S、Π，并用至少一个可重复参考姿态求 b；再用另外 3～5 个姿态验证同一个 b 能否复现轮轴位置。MuJoCo 通过不能替代这一步。
