        - heading "7.2 如果要自己复验，应按什么顺序" [level=3] [ref=e10551]
        - list [ref=e10552]:
          - listitem [ref=e10553]:
            - text: 完整基准点坐标复验：随机给 10～20 组 qf、qr；完整解析正解输出 J、L、P、M、K、N、W；MuJoCo 写入同一组主动/被动 qpos 后调用
            - code [ref=e10554]: mj_forward
            - text: ，逐点比较。
          - listitem [ref=e10555]:
            - text: CAD 简式复验：对同一组 q 只计算 J、L、P、M，再用 P=k
            - subscript [ref=e10556]: a
            - text: L、W=P+k
            - subscript [ref=e10557]: b
            - text: (M−L)；将 W、L0、φ0、J
            - subscript [ref=e10558]: H
            - text: 与对齐后的 CAD/XML 基准逐点比较。
          - listitem [ref=e10559]:
            - text: 雅可比有限差分复验：分别只扰动 qf 和 qr，比较
            - code [ref=e10560]: H(q+δq)−H(q)
            - text: 与解析
            - code [ref=e10561]: JH(q)δq
            - text: ；再把 δq 减半，一阶线性化余项应约缩小到四分之一。它是离线测试，不是 STM32 运行算法。
          - listitem [ref=e10562]:
            - text: 虚功/功率复验：随机给很小 δq 与虚拟力 [F0,Tφ]，检查
            - code [ref=e10563]: τᵀδq
            - text: 和
            - code [ref=e10564]: F0δL0+Tφδφ0
            - text: ；这一步专门检出转置、φ0/θ 负号、前后列交换问题。
          - listitem [ref=e10565]: MuJoCo 控制 A/B：在同一个模型、初始姿态、限幅和控制周期下，依次切换“旧理想 H/J”“完整两圆 H/J”“一次闭链简化 H/J”；先做零力矩、低增益静态腿长，再做小幅正弦腿长，最后才接完整 LQR。
          - listitem [ref=e10566]: 实车模型角标定：确认每台电机的 S、Π，并用至少一个可重复参考姿态求 b；再用另外 3～5 个姿态验证同一个 b 能否复现轮轴位置。MuJoCo 通过不能替代这一步。
        - generic [ref=e10567]: 所以 MuJoCo 是下一步最合理的控制验证环境，但不是第一次数学验证。前 3 步先证明 H、J 和 Jᵀ 的代数链正确；第 4 步才回答“换进控制器后是否稳定”；第 5 步才回答“实车零点和几何是否与 XML 一致”。
