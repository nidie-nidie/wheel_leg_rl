              - generic [ref=f2e3759]: 先算 ρN=‖rP−rK‖ 并检查三角不等式；通过后才计算单位向量 eN、aN、hN
            - generic [ref=f2e3760]:
              - generic [ref=f2e3762]: ρN>ε
              - generic [ref=f2e3763]: abs(ℓKN−ℓPN)<ρN
