        - generic [ref=f2e2203]:
          - text: 上标 ref 到底是什么：
          - code [ref=f2e2204]: ref
          - text: 是 reference（参考构型） 的缩写，不是乘方，也不是“实车编码器零点”。例如
          - generic "向量 v" [ref=f2e2205]: → v
          - subscript [ref=f2e2206]: MK
          - superscript [ref=f2e2207]: ref
          - text: 表示“在 XML 的参考构型/刚体参考坐标中，从 M 指向 K 的固定二维向量”。它同时保存 M→K 的固定长度和固定方向；运行时刚体转过 α 后，当前向量变为
          - code [ref=f2e2208]: R(α)vMKref
          - text: 。更严格地说，它是一个体固连几何向量。
        - generic [ref=f2e2209]:
          - text: 为什么 I→L 与 I→P 要分别保留：它们属于同一个后主动刚体
          - code [ref=f2e2210]: jIO
          - text: ，都从共同转轴 I 出发，所以方向看起来几乎一样；但 L 和 P 是两个不同的固定点。L 是第一次闭链求 M 时的已知圆心，P 是第二次闭链求 N、随后定位输出刚体 W 时的已知圆心。名义 XML 中 ℓ
          - subscript [ref=f2e2211]: IL
          - text: =0.096974410 m、ℓ
          - subscript [ref=f2e2212]: IP
          - text: =0.214974163 m，长度比为 2.216813；两者方向角还相差约 −0.072154°。把 I→P 最佳拟合成 k(I→L) 后，仍有约 0.270723 mm 的垂向残差，因此它们不是同一向量，也不是严格的倍数关系。即使 CAD 最终证明它们严格共线，也只能写成
          - generic "向量 v" [ref=f2e2213]: → v
          - subscript [ref=f2e2214]: IP
          - text: =k
          - generic "向量 v" [ref=f2e2215]: → v
          - subscript [ref=f2e2216]: IL
          - text: ，仍不能删掉 P，因为两次闭链使用的是两个不同的圆心。
        - paragraph [ref=f2e2217]:
          - text: 这九个参考向量并不全都表达在同一个 body frame 中；“所属刚体参考坐标”列就是它们各自的坐标归属。当前根部 +90° 参考旋转使主动端局部 +x
          - subscript [ref=f2e2218]: local
          - text: 在二维推导中对应 +s=+base Y，+z
          - subscript [ref=f2e2219]: local
          - text: 对应 +base Z。运行时必须先随所属刚体旋转到同一个 I–s–z 平面，之后才能做向量加减。
