          - text: 判断电机仍在运动，没有对速度取绝对值；但四台校准命令里有两台是负速度。因此负向高速运动可能被提前判成“已停止”并保存零点。当前
          - code [ref=f2e2099]: ENABLE_CHASSIS_CALIBRATE=false
