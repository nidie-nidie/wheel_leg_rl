            - generic [ref=f2e3765]: 是：存在两个候选 N
            - generic [ref=f2e3766]: 否
            - generic [ref=f2e3767]:
              - generic [ref=f2e3769]: 终止本周期：闭链 2 无安全实解
              - generic [ref=f2e3770]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=f2e3771]:
              - generic [ref=f2e3773]: 选择物理装配支路 N；q=0 时 σN=−1
              - generic [ref=f2e3774]: 运行时比较 N± 与上一周期 N；第二次 +eN⊥ 指向右下，所以实际上方 N 使用 −1
