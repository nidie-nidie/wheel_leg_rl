        - generic [ref=f1e2537]: 两种装配支路：每次圆交通常都有两个候选点。离线零位中第一次使用 σ=+1、第二次使用 σ=−1 才对应 XML 当前装配；实时计算更稳妥的方式是选择“与上一周期交点最近”的候选点，避免跳到机构另一侧。
        - generic [ref=f1e2538]: 不要把后续定位向量当成圆半径：|MK|=0.176308 m 是求得 M 后定位 K 的体固连向量；|PW|=0.258000 m 是求得 N 后定位 W 的体固连向量。它们不参与各自前一步的圆交半径约束。
        - heading "4.3 从电机反馈到轮轴坐标：把两次闭链完全展开" [level=3] [ref=f1e2539]
        - paragraph [ref=f1e2540]: 下面的流程只描述正运动学。所谓“闭链 1”是前支路 J→M 与后侧刚体固定点距 L→M 必须在同一个 M 会合；“闭链 2”是连杆 K→N 与输出刚体固定点距 P→N 必须在同一个 N 会合。圆只是这两个固定距离约束的坐标表达。
        - img "从 XML 固定几何和实时时关节角开始，经 J L 两圆求 M、由刚体求 K、K P 两圆求 N、由输出刚体求 W，最终得到 L0 phi0 theta 的详细闭链流程图" [ref=f1e2542]:
          - generic [ref=f1e2549]:
            - generic [ref=f1e2550]: A 数据来源与坐标对齐
            - generic [ref=f1e2551]: B 闭链 1：J–M–L 会合于 M
            - generic [ref=f1e2552]: C 刚体 jMK：由 M、L 的朝向定位 K
            - generic [ref=f1e2553]: D 闭链 2：K–N–P 会合于 N
            - generic [ref=f1e2554]: E 输出刚体与虚拟腿坐标
          - generic [ref=f1e2560]:
            - generic [ref=f1e2561]: 开始：执行一次腿部正运动学
            - generic [ref=f1e2564]:
              - generic [ref=f1e2566]: 固定输入：XML / CAD 刚体几何
              - generic [ref=f1e2567]: 主动端向量 vIJ、vIL、vIP；固定杆长 |JM|、|LM|、|KN|、|PN|
              - generic [ref=f1e2568]: 体固连向量 vML、vMK、vPN、vPW；整个运行期间不随姿态改变
            - generic [ref=f1e2569]:
              - generic [ref=f1e2571]: 实时输入：编码器位置或 MuJoCo qpos
              - generic [ref=f1e2572]: 先统一极性、前后顺序和零偏：qmodel = SΠ·pmotor + b
              - generic [ref=f1e2573]: 得到模型主动角 qf（前支路）、qr（后支路），单位 rad
            - generic [ref=f1e2574]:
              - generic [ref=f1e2576]: 先把三个主动端点放进以 I 为原点的 (s,z) 腿平面
              - generic [ref=f1e2577]: J=R(qf)vIJ L=R(qr)vIL P=R(qr)vIP
              - generic [ref=f1e2578]: 此时已知三个二维坐标：j=(sJ,zJ)、l=(sL,zL)、p=(sP,zP)
            - generic [ref=f1e2579]:
              - generic [ref=f1e2581]: 第一次闭链：未知点 M 必须同时满足两条固定距离
              - generic [ref=f1e2582]: 圆心 J、半径 |JM| ∩ 圆心 L、半径 |LM| → 候选 M₊、M₋
              - generic [ref=f1e2583]: 物理含义：前支路杆 JM 与后侧刚体内点距 LM 必须在同一个铰点 M 会合
              - generic [ref=f1e2584]: 先算 ρM=‖L−J‖ 并检查三角不等式；通过后才计算 eM、aM、hM
            - generic [ref=f1e2585]:
              - generic [ref=f1e2587]: ρM>ε
              - generic [ref=f1e2588]: "|JM−LM|<ρM"
              - generic [ref=f1e2589]: ρM<JM+LM？
            - generic [ref=f1e2590]: 是：存在两个候选 M
            - generic [ref=f1e2591]: 否
            - generic [ref=f1e2592]:
              - generic [ref=f1e2594]: 终止本周期：闭链 1 无安全实解
              - generic [ref=f1e2595]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=f1e2596]:
              - generic [ref=f1e2598]: 选择与 XML 装配/上一周期连续的 σM，输出 M 的实际坐标
              - generic [ref=f1e2599]: eM=(L−J)/ρM；算 aM、hM；M=J+aM eM+σM hM eM⊥
            - generic [ref=f1e2600]:
              - generic [ref=f1e2602]: 刚体 jMK：M、L 两点确定当前朝向，再定位同一刚体上的 K
              - generic [ref=f1e2603]: α=arg(L−M)−arg(vML)
              - generic [ref=f1e2604]: K=M+R(α)vMK → k=(sK,zK)；K 不是直接从静态 XML 抄出的当前坐标
            - generic [ref=f1e2605]:
              - generic [ref=f1e2607]: 第二次闭链：未知点 N 必须同时满足两条固定距离
              - generic [ref=f1e2608]: 圆心 K、半径 |KN| ∩ 圆心 P、半径 |PN| → 候选 N₊、N₋
              - generic [ref=f1e2609]: 物理含义：连杆 KN 与输出刚体内点距 PN 必须在同一个铰点 N 会合
              - generic [ref=f1e2610]: 先算 ρN=‖P−K‖ 并检查三角不等式；通过后才计算 eN、aN、hN
            - generic [ref=f1e2611]:
              - generic [ref=f1e2613]: ρN>ε
              - generic [ref=f1e2614]: "|KN−PN|<ρN"
              - generic [ref=f1e2615]: ρN<KN+PN？
            - generic [ref=f1e2616]: 是：存在两个候选 N
            - generic [ref=f1e2617]: 否
            - generic [ref=f1e2618]:
              - generic [ref=f1e2620]: 终止本周期：闭链 2 无安全实解
              - generic [ref=f1e2621]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=f1e2622]:
              - generic [ref=f1e2624]: 选择与 XML 装配/上一周期连续的 σN，输出 N 的实际坐标
              - generic [ref=f1e2625]: eN=(P−K)/ρN；算 aN、hN；N=K+aN eN+σN hN eN⊥
            - generic [ref=f1e2626]:
              - generic [ref=f1e2628]: 输出刚体 jOP：P、N 两点确定朝向 β，再直接定位轮轴 W
              - generic [ref=f1e2629]: β=arg(N−P)−arg(vPN)
              - generic [ref=f1e2630]: W=P+R(β)vPW → w=(sW,zW)
              - generic [ref=f1e2631]: 这里没有第三次圆交：P 给位置，P→N 给朝向，固定 P→W 给轮轴在刚体内的位置
            - generic [ref=f1e2632]:
              - generic [ref=f1e2634]: 把轮轴坐标变成控制器使用的虚拟腿状态
              - generic [ref=f1e2635]: dW=−zW；L0=√(sW²+dW²)；φ0=atan2(dW,sW)
              - generic [ref=f1e2636]: θleg=π/2−φ0；控制状态 θ=π/2−Pitch−φ0
            - generic [ref=f1e2637]:
              - generic [ref=f1e2639]: 正运动学 H(q) 完成
              - generic [ref=f1e2640]: 输出 W、L0、φ0、θ，供 Observe/LQR 与下一节 JH 使用
