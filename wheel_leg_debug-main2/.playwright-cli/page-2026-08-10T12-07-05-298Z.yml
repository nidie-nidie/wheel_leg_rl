              - generic [ref=e3779]: rW=rP+R(β)vPW → rW=(sW,zW)（rW 是位置向量）
              - generic [ref=e3780]: 这里没有第三次圆交：P 给位置，P→N 给朝向，固定 P→W 给轮轴在刚体内的位置
