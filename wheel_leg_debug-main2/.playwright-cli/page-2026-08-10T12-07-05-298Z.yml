            - generic [ref=e3700]: B 闭链 1：J–M–L 会合于 M
            - generic [ref=e3701]: C 刚体 jMK：由 M、L 的朝向定位 K
            - generic [ref=e3702]: D 闭链 2：K–N–P 会合于 N
