        - heading "4.3 从电机反馈到轮轴坐标：把两次闭链完全展开" [level=3] [ref=f1e3397]
        - paragraph [ref=f1e3398]: 下面的流程只描述正运动学。所谓“闭链 1”是前支路 J→M 与后侧刚体固定点距 L→M 必须在同一个 M 会合；“闭链 2”是连杆 K→N 与输出刚体固定点距 P→N 必须在同一个 N 会合。圆只是这两个固定距离约束的坐标表达。
        - img "从 XML 固定几何和实时时关节角开始，经 J L 两圆求 M、由刚体求 K、K P 两圆求 N、由输出刚体求 W，最终得到 L0 phi0 theta 的详细闭链流程图" [ref=f1e3400]:
          - generic [ref=f1e3407]:
            - generic [ref=f1e3408]: A 数据来源与坐标对齐
            - generic [ref=f1e3409]: B 闭链 1：J–M–L 会合于 M
            - generic [ref=f1e3410]: C 刚体 jMK：由 M、L 的朝向定位 K
            - generic [ref=f1e3411]: D 闭链 2：K–N–P 会合于 N
            - generic [ref=f1e3412]: E 输出刚体与虚拟腿坐标
          - generic [ref=f1e3418]:
            - generic [ref=f1e3419]: 开始：执行一次腿部正运动学
            - generic [ref=f1e3422]:
              - generic [ref=f1e3424]: 固定输入：XML / CAD 刚体几何
              - generic [ref=f1e3425]: 参考向量 vIJ、vIL、vIP；标量杆长 ℓJM、ℓLM、ℓKN、ℓPN
              - generic [ref=f1e3426]: 体固连参考向量 vML、vMK、vPN、vPW；运行期间不改变
            - generic [ref=f1e3427]:
              - generic [ref=f1e3429]: 实时输入：编码器位置或 MuJoCo qpos
