        - heading "4.2 两次圆交到底在求什么" [level=3] [ref=f1e2156]
        - generic [ref=f1e2157]: 先给出完整顺序：圆交不是控制器额外发明的“圆形机构”，而是把两条固定杆长约束写成坐标方程。当前正解严格按下面顺序执行，后一步只能使用前一步已经求出的点。
