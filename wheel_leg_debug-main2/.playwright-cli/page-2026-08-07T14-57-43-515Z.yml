              - generic [ref=e3542]: 先算 ρN=‖rP−rK‖ 并检查三角不等式；通过后才计算单位向量 eN、aN、hN
            - generic [ref=e3543]:
              - generic [ref=e3545]: ρN>ε
              - generic [ref=e3546]: abs(ℓKN−ℓPN)<ρN
