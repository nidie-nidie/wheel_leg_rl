              - generic [ref=e3510]: 本框中的 rJ、rL、rP 均是二维位置向量；下一行公式使用上箭头严格标记
            - generic [ref=e3511]:
              - generic [ref=e3513]: 第一次闭链：未知点 M 必须同时满足两条固定距离
