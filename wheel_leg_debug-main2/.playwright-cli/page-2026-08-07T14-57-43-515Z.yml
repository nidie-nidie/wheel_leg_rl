            - generic [ref=e3549]: 否
            - generic [ref=e3550]:
              - generic [ref=e3552]: 终止本周期：闭链 2 无安全实解
              - generic [ref=e3553]: 圆心重合 / 无实交 / 相切奇异
            - generic [ref=e3554]:
              - generic [ref=e3556]: 选择与 XML 装配/上一周期连续的 σN，输出 N 的实际坐标
              - generic [ref=e3557]: eN=(rP−rK)/ρN；rN=rK+aN eN+σN hN eN⊥（这些 r、e 都是向量）
            - generic [ref=e3558]:
              - generic [ref=e3560]: 输出刚体 jOP：P、N 两点确定朝向 β，再直接定位轮轴 W
