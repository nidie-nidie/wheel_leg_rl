              - generic [ref=e3515]: 物理含义：前支路杆 JM 与后侧刚体内点距 LM 必须在同一个铰点 M 会合
              - generic [ref=e3516]: 先算 ρM=‖rL−rJ‖ 并检查三角不等式；通过后才计算单位向量 eM、aM、hM
            - generic [ref=e3517]:
              - generic [ref=e3519]: ρM>ε
