        - generic [ref=e2538]: 不要把后续定位向量当成圆半径：|MK|=0.176308 m 是求得 M 后定位 K 的体固连向量；|PW|=0.258000 m 是求得 N 后定位 W 的体固连向量。它们不参与各自前一步的圆交半径约束。
        - heading "4.3 从电机反馈到轮轴坐标：把两次闭链完全展开" [level=3] [ref=e2539]
        - paragraph [ref=e2540]: 下面的流程只描述正运动学。所谓“闭链 1”是前支路 J→M 与后侧刚体固定点距 L→M 必须在同一个 M 会合；“闭链 2”是连杆 K→N 与输出刚体固定点距 P→N 必须在同一个 N 会合。圆只是这两个固定距离约束的坐标表达。
