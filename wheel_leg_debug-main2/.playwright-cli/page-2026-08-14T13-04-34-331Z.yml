        - generic [ref=f3e3597]:
          - text: atan2 的 2 不是系数。
          - code [ref=f3e3598]: atan2(y,x)
          - text: 表示“把 y 和 x 两个参数一起交给反正切函数”。例如 atan2(+1,+1)=45°，而 atan2(+1,−1)=135°；若只算 atan(y/x)，第二个例子会错误地退化成 −45°，丢失所在象限。
