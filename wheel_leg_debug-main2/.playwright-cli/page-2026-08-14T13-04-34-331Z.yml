      - generic [ref=f3e1097]:
        - heading "1. 结论先行" [level=2] [ref=f3e1098]
        - generic [ref=f3e1099]: 推荐控制算法已经进一步化简。 当前 XML 的第二级 L–K–N–P 在名义尺寸下是平行四边形，所以运行时只需要第一次圆交求 M；K、N 和第二次圆交保留为离线完整模型，用来验证简化关系，不再作为推荐的 STM32 实时路径。
        - generic [ref=f3e1100]:
          - generic [ref=f3e1101]:
            - generic [ref=f3e1102]: 1 次
            - generic [ref=f3e1103]: 闭链求 M，再由固定相似关系得到 W
          - generic [ref=f3e1104]:
            - generic [ref=f3e1105]: 1.616 mm
            - generic [ref=f3e1106]: 理想五杆在验证域内最大腿长误差
          - generic [ref=f3e1107]:
            - generic [ref=f3e1108]: 1.102°
            - generic [ref=f3e1109]: 理想五杆在验证域内最大角度误差
          - generic [ref=f3e1110]:
            - generic [ref=f3e1111]: 不变
            - generic [ref=f3e1112]:
              - text: LQR θ=0 与 VMC τ=J
              - subscript [ref=f3e1113]: H
              - superscript [ref=f3e1114]: T
              - text: F 原理
        - heading "一句话解释发生了什么" [level=3] [ref=f3e1115]
        - generic [ref=f3e1116]: PDF： 理想主动杆角 φ=[φ1, φ4]ᵀ ──理想五杆 f──▶ y=[L0, φ0]ᵀ XML： q=[q前,q后]ᵀ → J,L,P → 第一次闭链求 M → W=P+Sb(M−L) → y=[L0,φ0]ᵀ 共同部分： [F0, Tp] ── J_Hᵀ ──▶ 两台关节电机力矩
        - paragraph [ref=f3e1117]:
          - text: 所以不是“偏置机构不能做 VMC”，而是目前把
          - code [ref=f3e1118]: q前/q后
          - text: 只经过负号和固定 offset 后，直接当作 PDF 的
          - code [ref=f3e1119]: φ4/φ1
          - text: 。这在一个姿态附近可以接近，但不可能在整个构型域完全一致。
        - generic [ref=f3e1120]: 两个模型必须分开读：完整 XML 基准保留导出文件中的全部小数，用来验证闭链树和 MuJoCo；4.3 的 CAD 设计模型则按机械约束强制 I、L、P 共线并令 P→W∥L→M。旧的“微米级简式误差”属于保留 XML 小角度的基准化简，不能再冒充 CAD 约束模型的误差。两者约 0.271 mm 的名义差异应通过 CAD/XML 对齐解决。
        - generic [ref=f3e1121]:
          - text: 重要的量级判断： 名义 XML 与理想五杆确实有构型相关误差，但扫描
          - code [ref=f3e1122]: L0=0.15…0.42 m
          - text: 、
          - code [ref=f3e1123]: φ0=70…110°
          - text: 后最大只有约 1.616 mm、1.102°。它值得修正，却未必能单独解释“长腿完全对不上”或猛烈磕头；坐标、MIT/VMC 叠加、饱和和软约束还要分开查。
      - generic [ref=f3e1124]:
        - heading "2. 车体、虚拟腿和各个角度到底画在哪里" [level=2] [ref=f3e1125]
        - paragraph [ref=f3e1126]:
          - text: 先不用“笛卡尔映射”这个词。给定前、后两个主动关节角以后，正运动学第一件事只是求出：轮轴中心
          - code [ref=f3e1127]: W
          - text: 相对髋轴中心
