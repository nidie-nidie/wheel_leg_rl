            - generic [ref=f3e3609]: 再由刚体 M–L–K 求 K
            - generic [ref=f3e3611]: 第二次圆交：求 N
            - generic [ref=f3e3612]: P、N 定姿态；固定 P→W 定位 W
            - generic [ref=f3e3614]: 得到真实轮轴 W
            - generic [ref=f3e3615]: 再换算 L0、φ0、JH
