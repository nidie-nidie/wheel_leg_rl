        - generic [ref=e4784]: 为什么它仍比理想五杆公式长：理想五杆只有一个主要闭合三角形；当前偏置机构包含 J–M–L 与 K–N–P 两次闭合，还包含 M–L–K、P–N–W 两个不共线刚体三角形。因此可以闭式直算，但必然是“两次余弦定理 + 两次固定刚体变换”，不能在不丢失真实几何的情况下压缩成理想五杆那四个短三角函数系数。
        - heading "4.3 从电机反馈到轮轴坐标：把两次闭链完全展开" [level=3] [ref=e4785]
        - paragraph [ref=e4786]: 下面的流程只描述正运动学。所谓“闭链 1”是前支路 J→M 与后侧刚体固定点距 L→M 必须在同一个 M 会合；“闭链 2”是连杆 K→N 与输出刚体固定点距 P→N 必须在同一个 N 会合。圆只是这两个固定距离约束的坐标表达。
        - img "从 XML 固定几何和实时时关节角开始，经 J L 两圆求 M、由刚体求 K、K P 两圆求 N、由输出刚体求 W，最终得到 L0 phi0 theta 的详细闭链流程图" [ref=e4788]:
          - generic [ref=e4795]:
            - generic [ref=e4796]: A 数据来源与坐标对齐
            - generic [ref=e4797]: B 闭链 1：J–M–L 会合于 M
